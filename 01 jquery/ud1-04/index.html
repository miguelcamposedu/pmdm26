<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de tablas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #td-add-row {
            border: 1px dotted #bbbbbb;
        }

        #td-add-row:hover {
            border: none;
            background-color: blue;
        }

        #btn-add-row {
            width: 100%;

        }

        #btn-add-row:hover {
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container text-center">
        <div class="row mt-5 mb-5">
            <div class="col-12">
                <button type="button" class="btn btn-danger" id="btn-delete-table">Eliminar tabla</button>
                <button type="button" class="btn btn-primary" id="btn-add-table">➕ Añadir tabla</button>
                <button type="button" class="btn btn-primary" id="btn-add-col">➕ Añadir columna</button>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <table class="table table-striped" id="table-dynamic">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">First</th>
                            <th scope="col">Last</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th scope="row">1</th>
                            <td>Mark</td>
                            <td>Otto</td>
                            <td><button type="button" class="btn btn-danger btn-delete-row">Eliminar
                                    fila</button></td>
                        </tr>
                        <tr>
                            <th scope="row">2</th>
                            <td>Jacob</td>
                            <td>Thornton</td>
                            <td><button type="button" class="btn btn-danger btn-delete-row">Eliminar
                                    fila</button></td>
                        </tr>
                        <tr>
                            <th scope="row">3</th>
                            <td>John</td>
                            <td>Doe</td>
                            <td><button type="button" class="btn btn-danger btn-delete-row">Eliminar
                                    fila</button></td>
                        </tr>
                        <tr id="tr-add-row">
                            <td colspan="4" id="td-add-row">
                                <span id="btn-add-row">Añadir
                                    fila</span>
                            </td>

                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>



    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="index.js"></script>

</body>

</html>
