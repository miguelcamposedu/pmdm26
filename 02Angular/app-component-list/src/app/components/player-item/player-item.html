<section class="card" style="max-width: 320px">
    <img [src]="player()?.photoUrl" class="card-img-top" alt="...">
    <div class="card-body">
        <h4 class="card-title">{{player()?.fullName}}</h4>
        <p class="card-text">{{player()?.age}}</p>
        <a href="#" class="btn-solid theme-primary">View player detail</a>
    </div>
</section>
