<div class="row">
    <div class="col-12">
        <h3>Detalle Episodio</h3>
    </div>
</div>
<div class="row">
    <div class="col-3">
        @if (episode(); as ep) {
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ ep.name }}</h5>
                <h6 class="card-subtitle mb-2 text-body-secondary">{{ ep.episode }}</h6>
                <p class="card-text">{{ ep.air_date }}</p>
            </div>
        </div>
        }
    </div>
</div>
